name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r ..\requirements-dev.txt

      - name: Tag confere com APP_VERSION
        run: python -c "import config, sys; sys.exit(0 if 'v' + config.APP_VERSION == '${{ github.ref_name }}' else 'a tag difere de APP_VERSION')"

      - name: Testes
        run: python -m pytest

      - name: Build
        run: python -m PyInstaller G-Path.spec --noconfirm --clean

      - name: Pacote
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "G-Path-$version-windows.zip"
          Copy-Item ..\LICENSE, ..\THIRD-PARTY-LICENSES.txt, ..\CHANGELOG.md dist\G-Path
          Copy-Item ..\examples dist\G-Path\examples -Recurse
          Compress-Archive dist\G-Path $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" $env:ZIP "$env:ZIP.sha256" --draft --prerelease --title "G-Path ${{ github.ref_name }}" --notes "Extraia tudo antes de abrir o G-Path.exe."